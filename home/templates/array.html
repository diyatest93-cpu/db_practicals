<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: beige;
        }
        p{
            font-size: 20px;
            color: navy;
        }
        .container{
            display: flex;
        }
        button{
            height: 40px;
            width: 70px;
            background-color: rgba(0, 0, 255, 0.89);
            border: none;
            color: white;
            border-radius:10px ;
        }
        button:hover{
            background-color: navy;
            cursor: pointer;
        }
        div{
            color: green;
            font-size: 25px;
            
        }
        
    </style>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
    <p>Enter Values with space :</p>
    <input type="text" name="arr" id=""><br><br>
    <div class="container">
    <button type="submit"> submit</button><br>
    <button type="reset" style="background-color: red; margin-left: 10px; cursor: pointer;" class="b1">Clear</button>
    </div>
    </form>
    {% if result %}
    <p style="color: green;">Reverse is: </p> 
        {% for i in result %}
           <div> {{ i }} </div>
        {% endfor %}  
    {%endif%}      

</body>
</html>
