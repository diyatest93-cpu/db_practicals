{% extends "base.html"  %}
{% block start%}
    
    {{peoples}}

    <table class="container">
  <tr>
    <th>SNo</th>
    <th>Name</th>
    <th>Age</th>
    <th>Vote</th>
  </tr>
  {% for peoples in peoples %}
  <tr>
    <td>{{forloop.counter}}</td>
    <td>{{peoples.name}}</td>
    <td>{{peoples.age}}</td>
    <td {% if peoples.age < 18 %} style="background:red" {% endif %}>
        {% if peoples.age >= 18 %}
        👍
        {% else %} 
        👎
        {% endif %}
        </td>
  </tr>
  {% endfor %}
  
</table>

<a href="/contact/">
  Contact
</a>
|
<a href="/about/">
  about
</a>




{% endblock %}
