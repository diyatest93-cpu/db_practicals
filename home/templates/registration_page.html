<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:#f6f5ff;
        }
        .main{
            
            height: 600px;
            width: 700px;
            justify-content: center;
            text-align: center;
            margin: 20px 250px;
        }
        h2{
            margin-top: 30px;
            color: navy;
            text-align: center;
            
        }
        .container{
            height: 400px;
            width: 550px;
            
            margin:30px  90px;
            text-align: center;
            padding-top: 40px;
            background-color:white;
            box-shadow: 15px 15px 10px 5px rgba(0,0,0,0.1);
            border-radius: 20px;
        }
        .group{
            display: flex;
            margin: 10px 20px;
           
        }
        p{
            color:navy;
            font-size: 20px;

        }
        input{
            height: 30px;
            width: 60%;
            border: 0.5px solid navy;
            border-radius: 5px;
            margin-top: 18px;
            margin-left: 20px;
            
        }
        input:focus{
            border-color: navy;
            box-shadow: 0 0 5px #0d6efd;
            outline: none;
        }
        #p1{
            height: 16px;
            width: 20px;
            color:navy;
            margin-top: 25px;
        }
        #p2{
            height: 16px;
            width: 20px;
            color:navy;
            margin-top: 25px;
            
        }
        button{
            height: 30px;
            width: 90px;
            background-color: rgba(0, 0, 255, 0.911);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 15px;
        }
        button:hover{
            background-color: rgba(0, 0, 255, 0.822);
        }
        
    </style>
</head>
<body>
    
    <div class="main">
    <h2>Registration Page</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="container">
            <div class="group">
                <p>Enter Name:</p>
                <input type="text" name="name" id="name" required>
            </div>
            <div class="group">

                <p>Enter Email:</p>
                <input type="text" name="email" id="email" required>
            </div>
            <div class="group">
                <p>Enter Password:</p>
                <input type="text" name="password" id="password" required>
            </div>
            <div class="group">
                <p>Select Gender:</p>
                <input type="radio" name="gender" value="Male" id="p1"><p>Male</p>
                <input type="radio" name="gender" value="Female" id="p2"><p>Female</p>
        </div>

        <button type="submit">Register</button>
        </div>

    </form>
    </div>
</body>
</html>
