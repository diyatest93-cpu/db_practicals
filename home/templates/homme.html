<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            color: blueviolet;
            text-align: center;
            font-size: 30px;
        }
        .main{
            text-align: center;
        }
        .group{
            display: flex;
            text-align: center;
            justify-content: center;
            
            font-size: 20px;
        }
        .para{
            margin-top:19px ;
            margin-right: 20px;
        }
        p{
            color:green;
        }
    </style>
</head>
<body>
    <h2>Home Page</h2>
    <div class="main">
        <div class="group">
            <div class="para">Welcome </div>
            <p>{{name}}</p>
        </div>
        <div class="group">
            <div class="para">Your Gender is: </div>
            <p>{{gender}}</p>
        </div>
    </div>
</body>
</html>
