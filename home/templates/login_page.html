<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:#f5f7ff;
        }
        .main{
            
            height: 400px;
            width: 700px;
            justify-content: center;
            text-align: center;
            margin: 20px 250px;
        }
        h2{
            margin-top: 30px;
            color: navy;
            text-align: center;
            
        }
        .container{
            height: 300px;
            width: 550px;
            
            margin:30px  90px;
            text-align: center;
            padding-top: 40px;
            background-color:white;
            box-shadow: 10px 10px 10px 5px rgba(0,0,0,0.1);
            border-radius: 20px;
        }
        .group{
            display: flex;
            margin: 10px 20px;
           
        }
        p{
            color:navy;
            font-size: 20px;

        }
        input{
            height: 30px;
            width: 60%;
            border: 0.5px solid navy;
            border-radius: 5px;
            margin-top: 18px;
            margin-left: 20px;
            
        }
        input:focus{
            border-color: navy;
            box-shadow: 0 0 5px #0d6efd;
            outline: none;
        }
        .para{
            color:red;
            font-size: 30px;
            width: 100%;
            
        }
        
        button{
            height: 30px;
            width: 90px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 15px;
        }
        button:hover{
            background-color: rgba(0, 0, 255, 0.822);
        }
    </style>
</head>
<body>
    <p class="para">{{msg}}</p>
    <div class="main">
        <h2>Login page</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="container">
            <div class="group">
                <p>Enter Email</p>
                <input type="text" name="lo_email">
            </div>
            <div class="group">
                <p>Enter password</p>
                <input type="text" name="lo_password">
            </div>

        <button type="submit">Login</button>
        </div>

    </form>
    </div>

</body>
</html>
